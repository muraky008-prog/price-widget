name: Update prices

on:
  schedule:
    # UTC 기준 3시간마다 = 한국시간 0, 3, 6, 9, 12, 15, 18, 21시
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute levels
        run: python compute.py

      - name: Commit data.json
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update prices $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
